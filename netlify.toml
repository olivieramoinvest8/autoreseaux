# Configuration Netlify du site "communicationsocial" (tableau de bord + fonctions).
[build]
  publish = "netlify/site"
  functions = "netlify/functions"
  command = "echo 'Site statique, rien a construire'"

# Le scanner de secrets de Netlify verifie que les valeurs des variables "secret" n'apparaissent pas dans les fichiers.
# Ces trois variables sont des adresses publiques (site, tableau de bord, projet Supabase) : on les exclut du scan.
# Les vraies cles (SUPABASE_SERVICE_KEY, META_*, DASHBOARD_PASSWORD, INTERNAL_SECRET) restent scannees.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "DASHBOARD_URL,SITE_BASE_URL,SUPABASE_URL"

[functions]
  node_bundler = "esbuild"
  included_files = ["brands/**", "templates/*.html", "assets/fonts/**", "assets/brand/logo-amo-invest.png", "render/render-image.js"]

# Lecture d'amoinvest.fr chaque matin a 7h UTC (9h Paris en ete, 8h en hiver).
[functions."read-listings"]
  schedule = "0 7 * * *"

# Publication des posts programmes : toutes les 10 minutes.
[functions."publish-scheduled"]
  schedule = "*/10 * * * *"

# Renouvellement du jeton Meta (60 jours) : verification hebdomadaire.
[functions."refresh-tokens"]
  schedule = "0 6 * * 1"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
