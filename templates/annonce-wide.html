<!--
  templates/annonce-wide.html — Affiche d'annonce AMO Invest en paysage, 1920×1080 (carte de fin d'une vidéo 16:9,
  vidéo Facebook, YouTube). Mêmes clés que annonce-feed.html / annonce-story.html ; rempli par render/render-image.js.

  Composition : photo principale à gauche coupée en diagonale, bloc bleu marine à droite (accroche, titre, caractéristiques,
  prix en relief doré, honoraires, DPE/GES), trois vignettes sous le prix, cartouche blanc en bas à droite avec le logo,
  la référence et l'adresse du site.

  Clés : photo_main, photo_1..3 (vignettes, facultatives), badge, kicker, title, price, fees, spec_1..4, dpe, ges,
         dpe_note (« en cours » / « non soumis » quand aucune lettre), ref, site.
-->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="render-size" content="1920x1080">
<title>AMO Invest — affiche annonce (paysage)</title>
<style>
  @font-face { font-family: "Oswald"; font-weight: 500; src: url("../assets/fonts/oswald-500.ttf") format("truetype"); }
  @font-face { font-family: "Oswald"; font-weight: 700; src: url("../assets/fonts/oswald-700.ttf") format("truetype"); }
  @font-face { font-family: "Inter";  font-weight: 400; src: url("../assets/fonts/inter-400.ttf")  format("truetype"); }
  @font-face { font-family: "Inter";  font-weight: 600; src: url("../assets/fonts/inter-600.ttf")  format("truetype"); }
  :root { --navy: #2E358D; --navy-deep: #1E2464; --gold: #E9CA31; --gold-dark: #E0B21F; --white: #FFFFFF; --pad: 56px; --panel: 800px; --footer-h: 150px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { position: relative; background: var(--navy-deep); color: var(--white); font-family: "Inter", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  /* Photo à gauche, coupée en diagonale à droite */
  .photo { position: absolute; left: 0; top: 0; width: 1200px; height: 1080px; background: url("{{photo_main}}") center / cover no-repeat;
    clip-path: polygon(0 0, 1200px 0, 1080px 1080px, 0 1080px); }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,24,70,.22) 0%, rgba(20,24,70,0) 30%); }
  .cut { position: absolute; left: 0; top: 0; width: 1220px; height: 1080px; background: var(--gold); clip-path: polygon(1200px 0, 1214px 0, 1094px 1080px, 1080px 1080px); }
  .badge { position: absolute; left: var(--pad); top: 56px; background: var(--gold); color: var(--navy-deep); font-family: "Oswald", sans-serif; font-weight: 700; font-size: 28px; letter-spacing: .14em; text-transform: uppercase; padding: 12px 24px; border-radius: 6px; box-shadow: 0 6px 0 var(--gold-dark); }
  /* Bloc bleu marine à droite */
  .block { position: absolute; left: 1120px; right: 0; top: 0; bottom: 0; background: linear-gradient(160deg, var(--navy) 0%, var(--navy-deep) 100%); }
  .block .w { position: absolute; inset: 0; background: rgba(255,255,255,.08); clip-path: polygon(760px 0, 800px 0, 640px 100%, 600px 100%); }
  .inner { position: absolute; left: 140px; right: var(--pad); top: 64px; bottom: calc(var(--footer-h) + 24px); display: flex; flex-direction: column; }
  .kicker { display: flex; align-items: center; gap: 14px; font-family: "Oswald", sans-serif; font-weight: 500; font-size: 26px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  .kicker::before { content: ""; width: 44px; height: 4px; background: var(--gold); }
  h1 { margin-top: 14px; font-family: "Oswald", sans-serif; font-weight: 700; font-size: 58px; line-height: 1.06; text-transform: uppercase; letter-spacing: .01em; }
  .specs { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; }
  .specs span { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 24px; letter-spacing: .04em; text-transform: uppercase; border: 2px solid rgba(255,255,255,.45); border-radius: 6px; padding: 5px 12px; }
  .row { margin-top: 30px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  .price { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 80px; line-height: 1; color: var(--gold); white-space: nowrap; text-shadow: 0 2px 0 var(--gold-dark), 0 4px 0 #C99E14, 0 6px 0 #A8830E, 0 12px 24px rgba(0,0,0,.45); }
  .fees { margin-top: 14px; font-size: 20px; font-weight: 600; color: rgba(255,255,255,.85); }
  .energy { display: flex; gap: 12px; }
  .energy .tag { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .energy .lab { font-family: "Oswald", sans-serif; font-size: 18px; letter-spacing: .14em; color: rgba(255,255,255,.75); }
  .energy .let { width: 66px; height: 66px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: "Oswald", sans-serif; font-weight: 700; font-size: 40px; color: #1A1A1A; background: #CCCCCC; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .let.note { width: auto; padding: 0 14px; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; background: rgba(255,255,255,.16); color: #fff; border: 2px solid rgba(255,255,255,.55); }
  .let.dpe-A { background: #00A06D; color: #fff; } .let.dpe-B { background: #52B153; color: #fff; } .let.dpe-C { background: #A5CE4D; }
  .let.dpe-D { background: #F4E70F; } .let.dpe-E { background: #F0B50F; } .let.dpe-F { background: #EB8235; color: #fff; } .let.dpe-G { background: #D7221F; color: #fff; }
  .let.ges-A { background: #EDE5F6; } .let.ges-B { background: #D2C0EA; } .let.ges-C { background: #B49BDD; } .let.ges-D { background: #9676CE; color: #fff; }
  .let.ges-E { background: #7A55BC; color: #fff; } .let.ges-F { background: #5E3AA2; color: #fff; } .let.ges-G { background: #412478; color: #fff; }
  .thumbs { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; height: 150px; }
  .thumbs div { background-position: center; background-size: cover; border: 4px solid var(--white); border-radius: 6px; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
  .thumbs .t1 { background-image: url("{{photo_1}}"); } .thumbs .t2 { background-image: url("{{photo_2}}"); } .thumbs .t3 { background-image: url("{{photo_3}}"); }
  /* Cartouche blanc en bas à droite */
  .footer { position: absolute; left: 1120px; right: 0; bottom: 0; height: var(--footer-h); background: var(--white); color: var(--navy); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--pad) 0 140px; }
  .footer img { height: 110px; width: auto; display: block; }
  .footer .r { text-align: right; }
  .footer .site { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 30px; letter-spacing: .08em; text-transform: uppercase; }
  .footer .ref { margin-top: 4px; font-size: 20px; font-weight: 600; color: var(--gold-dark); }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="cut"></div>
  <div class="badge" data-if="badge">{{badge}}</div>
  <section class="block">
    <div class="w"></div>
    <div class="inner">
      <div class="kicker" data-if="kicker">{{kicker}}</div>
      <h1>{{title}}</h1>
      <div class="specs"><span data-if="spec_1">{{spec_1}}</span><span data-if="spec_2">{{spec_2}}</span><span data-if="spec_3">{{spec_3}}</span><span data-if="spec_4">{{spec_4}}</span></div>
      <div class="row">
        <div><div class="price">{{price}}</div><div class="fees" data-if="fees">{{fees}}</div></div>
        <div class="energy">
          <div class="tag" data-if="dpe"><span class="lab">DPE</span><span class="let dpe-{{dpe}}">{{dpe}}</span></div>
          <div class="tag" data-if="ges"><span class="lab">GES</span><span class="let ges-{{ges}}">{{ges}}</span></div>
          <div class="tag" data-if="dpe_note"><span class="lab">DPE</span><span class="let note">{{dpe_note}}</span></div>
        </div>
      </div>
      <div class="thumbs" data-if="photo_1"><div class="t1"></div><div class="t2"></div><div class="t3"></div></div>
    </div>
  </section>
  <footer class="footer">
    <img src="../assets/brand/logo-amo-invest.png" alt="AMO Invest, agence immobilière">
    <div class="r"><div class="site">{{site}}</div><div class="ref">{{ref}} · « vous c'est nous »</div></div>
  </footer>
</body>
</html>
