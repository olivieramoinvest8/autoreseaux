<!--
  templates/datacard.html — Visuel "data card" AMO Invest, 1080×1350 : un chiffre-clé au centre.
  Rempli par render/render-image.js (mêmes règles que post-feed.html).

  Clés attendues :
    segment, title, figure, figure_label, cta, localisation
    body     2 phrases courtes maximum (la place est limitée sous le chiffre)
    source   mention de la source du chiffre (obligatoire : un chiffre sans source n'est pas publié)
-->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="render-size" content="1080x1350">
<title>AMO Invest — data card</title>
<style>
  @font-face { font-family: "Oswald"; font-weight: 500; src: url("../assets/fonts/oswald-500.ttf") format("truetype"); }
  @font-face { font-family: "Oswald"; font-weight: 700; src: url("../assets/fonts/oswald-700.ttf") format("truetype"); }
  @font-face { font-family: "Inter";  font-weight: 400; src: url("../assets/fonts/inter-400.ttf")  format("truetype"); }
  @font-face { font-family: "Inter";  font-weight: 600; src: url("../assets/fonts/inter-600.ttf")  format("truetype"); }
  :root { --navy:#2E358D; --navy-deep:#1E2464; --gold:#E9CA31; --gold-dark:#E0B21F; --white:#FFFFFF; --pad:84px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1350px; overflow:hidden; }
  body { position:relative; background:var(--white); color:var(--navy); font-family:"Inter","Liberation Sans",Arial,sans-serif; -webkit-font-smoothing:antialiased; }

  .band { position:absolute; left:0; right:0; top:0; height:600px; background:linear-gradient(160deg,var(--navy) 0%,var(--navy-deep) 100%);
    clip-path: polygon(0 0, 100% 0, 100% 470px, 0 560px); }
  .diag { position:absolute; inset:0; pointer-events:none; }
  .diag .gold  { position:absolute; inset:0; background:var(--gold); clip-path: polygon(1000px 0, 1026px 0, 836px 100%, 810px 100%); }
  .diag .white { position:absolute; inset:0; background:rgba(255,255,255,.35); clip-path: polygon(1046px 0, 1058px 0, 868px 100%, 856px 100%); }

  .head { position:absolute; left:var(--pad); right:var(--pad); top:var(--pad); color:var(--white); }
  .kicker { display:flex; align-items:center; gap:18px; font-family:"Oswald",sans-serif; font-weight:500; font-size:30px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); }
  .kicker::before { content:""; width:56px; height:4px; background:var(--gold); }
  h1 { margin-top:36px; font-family:"Oswald",sans-serif; font-weight:700; font-size:72px; line-height:1.05; text-transform:uppercase; max-width:780px; }

  /* Zone blanche : chiffre-clé puis texte, CTA calé en bas */
  .card { position:absolute; left:var(--pad); right:var(--pad); top:580px; bottom:200px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .card .num { font-family:"Oswald",sans-serif; font-weight:700; font-size:136px; line-height:1.2; color:var(--navy); }
  .card .label { margin-top:6px; font-size:32px; font-weight:600; color:var(--navy); }
  .card .body { margin-top:24px; font-size:27px; line-height:1.4; color:#33395F; white-space:pre-line; text-align:left; align-self:stretch; }
  .card .source { margin-top:14px; margin-bottom:20px; font-size:21px; color:#6B6F8A; align-self:flex-start; }
  .card .cta { margin-top:auto; margin-bottom:40px; align-self:flex-start; display:inline-flex; gap:20px; font-family:"Oswald",sans-serif; font-weight:500; font-size:34px; letter-spacing:.06em; text-transform:uppercase; color:var(--white); background:var(--navy); padding:14px 34px; border-radius:8px; box-shadow:0 6px 0 var(--navy-deep); }

  .footer { position:absolute; left:0; right:0; bottom:0; height:200px; border-top:6px solid var(--gold); background:var(--white); display:flex; align-items:center; justify-content:space-between; padding:0 var(--pad); }
  .footer img { height:150px; width:auto; display:block; }
  .footer .right { text-align:right; }
  .footer .loc { font-family:"Oswald",sans-serif; font-weight:500; font-size:30px; letter-spacing:.12em; text-transform:uppercase; color:var(--navy); }
  .footer .slogan { margin-top:8px; font-size:26px; font-weight:600; color:var(--gold-dark); }
</style>
</head>
<body>
  <div class="band"><div class="diag"><div class="gold"></div><div class="white"></div></div></div>
  <header class="head">
    <div class="kicker" data-if="segment">{{segment}}</div>
    <h1>{{title}}</h1>
  </header>
  <section class="card">
    <div class="num" data-if="figure">{{figure}}</div>
    <div class="label" data-if="figure_label">{{figure_label}}</div>
    <p class="body" data-if="body">{{body}}</p>
    <div class="source" data-if="source">{{source}}</div>
    <div class="cta" data-if="cta">{{cta}} →</div>
  </section>
  <footer class="footer">
    <img src="../assets/brand/logo-amo-invest.png" alt="AMO Invest, agence immobilière">
    <div class="right"><div class="loc">{{localisation}}</div><div class="slogan">« vous c'est nous »</div></div>
  </footer>
</body>
</html>
