# PHASE 6 - Rendu video. Declenchement manuel uniquement pour l'instant : rien ne tourne automatiquement lors d'un push.
name: render-video
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Chemin du scenario.json a rendre"
        required: true
        default: "content/runs/exemple/scenario.json"
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Rendu (a implementer en phase 6)
        run: |
          echo "Rendu video non implemente. Scenario demande : ${{ github.event.inputs.scenario }}"
